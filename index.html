  <style>
    /* Splash — يطابق شاشة الانتظار الرسمية UnifiedWaitScreen
       (حلقات متمددة هادئة + لوجو يتنفس + ثلاث نقاط نابضة، بدون أي اهتزاز). */
    #app-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center;
      background: hsl(210 20% 98%);
      transition: opacity .5s ease, visibility .5s ease;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      direction: rtl;
    }
    #app-splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #app-splash .wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 0 20px; text-align: center; }
    #app-splash .stage {
      position: relative; width: clamp(190px, 34vmin, 420px); aspect-ratio: 1/1;
      display: grid; place-items: center;
    }
    #app-splash .ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid rgba(11, 138, 143, .25);
      animation: sp-ring 2.4s ease-out infinite;
    }
    #app-splash .ring.r2 { animation-delay: .6s; border-color: rgba(11,138,143,.20); }
    #app-splash .ring.r3 { animation-delay: 1.2s; border-color: rgba(11,138,143,.15); }
    #app-splash .ring.r4 { animation-delay: 1.8s; border-color: rgba(11,138,143,.10); }
    #app-splash .disc {
      position: relative; width: 78%; height: 78%; border-radius: 50%;
      background: #ffffff; display: grid; place-items: center;
      box-shadow: 0 24px 60px -18px rgba(15,23,42,.22);
      animation: sp-float 3.6s ease-in-out infinite;
    }
    #app-splash .disc img {
      width: 82%; height: 82%; object-fit: contain; border-radius: 50%;
      animation: sp-breathe 3s ease-in-out infinite;
    }
    #app-splash .label { color: hsl(215 25% 15%); font-weight: 800; font-size: 17px; }
    #app-splash .sub { color: hsl(215 12% 50%); font-size: 12px; }
    #app-splash .dots { display: flex; gap: 8px; }
    #app-splash .dot { width: 8px; height: 8px; border-radius: 50%; background: #0b8a8f; opacity: .25; animation: sp-dot 1.2s ease-in-out infinite; }
    #app-splash .dot:nth-child(2) { animation-delay: .15s; }
    #app-splash .dot:nth-child(3) { animation-delay: .30s; }
    @keyframes sp-ring { 0% { transform: scale(.85); opacity: .9; } 80% { opacity: 0; } 100% { transform: scale(1.45); opacity: 0; } }
    @keyframes sp-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes sp-breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @keyframes sp-dot { 0%,80%,100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #app-splash .ring, #app-splash .disc, #app-splash .disc img, #app-splash .dot { animation: none; }
    }
  </style>
</head>
  <body>
    <div id="app-splash" aria-hidden="false">
      <div class="wrap">
        <div class="stage">
          <span class="ring"></span>
          <span class="ring r2"></span>
          <span class="ring r3"></span>
          <span class="ring r4"></span>
          <div class="disc">
            <img src="/images/yaqoubi-logo.jpeg" alt="مدرسة اليعقوبي الثانوية" />
          </div>
        </div>
        <div>
          <div class="label">مدرسة اليعقوبي الثانوية</div>
          <div class="sub">جارٍ تجهيز النظام، لحظات من فضلك</div>
        </div>
        <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Hide splash after React paints first frame
      (function () {
        var hide = function () {
          var s = document.getElementById('app-splash');
          if (!s) return;
          s.classList.add('hidden');
          setTimeout(function () { s && s.parentNode && s.parentNode.removeChild(s); }, 700);
        };
        window.addEventListener('load', function () {
          // Wait a tiny bit so users see the logo even on fast loads
          setTimeout(hide, 650);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
